import java.util.Properties

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def yandexDemoBannerAdUnitId = "demo-banner-yandex"
def yandexDemoInterstitialAdUnitId = "demo-interstitial-yandex"
def yandexProductionBannerAdUnitId = "R-M-20131427-1"
def yandexProductionInterstitialAdUnitId = "R-M-20131427-2"


def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withReader("UTF-8") { reader ->
        signingProperties.load(reader)
    }
}

def readSigningValue = { String propertyName, String environmentName ->
    def propertyValue = signingProperties.getProperty(propertyName)

    if (propertyValue != null && !propertyValue.trim().isEmpty()) {
        return propertyValue
    }

    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue
    }

    return null
}

def releaseStoreFilePath = readSigningValue("storeFile", "TEXT_QUEST_SIGNING_STORE_FILE")
def releaseStorePassword = readSigningValue("storePassword", "TEXT_QUEST_SIGNING_STORE_PASSWORD")
def releaseKeyAlias = readSigningValue("keyAlias", "TEXT_QUEST_SIGNING_KEY_ALIAS")
def releaseKeyPassword = readSigningValue("keyPassword", "TEXT_QUEST_SIGNING_KEY_PASSWORD")
def releaseStoreFile = releaseStoreFilePath == null ? null : rootProject.file(releaseStoreFilePath)

def missingReleaseSigningValues = {
    def missing = []

    if (releaseStoreFilePath == null) {
        missing.add("storeFile / TEXT_QUEST_SIGNING_STORE_FILE")
    }
    if (releaseStorePassword == null) {
        missing.add("storePassword / TEXT_QUEST_SIGNING_STORE_PASSWORD")
    }
    if (releaseKeyAlias == null) {
        missing.add("keyAlias / TEXT_QUEST_SIGNING_KEY_ALIAS")
    }
    if (releaseKeyPassword == null) {
        missing.add("keyPassword / TEXT_QUEST_SIGNING_KEY_PASSWORD")
    }

    return missing
}

def buildConfigString = { String value -> '"' + value + '"' }

def validateProductionAdUnitId = { String name, String value ->
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(name + " must be configured for release builds.")
    }

    if (
        value == yandexDemoBannerAdUnitId ||
        value == yandexDemoInterstitialAdUnitId ||
        value.startsWith("demo-")
    ) {
        throw new GradleException(name + " must not use a Yandex demo placement in release builds.")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.github.regstar2.textquestanthology"

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStoreFile != null) {
                storeFile releaseStoreFile
            }
            if (releaseStorePassword != null) {
                storePassword releaseStorePassword
            }
            if (releaseKeyAlias != null) {
                keyAlias releaseKeyAlias
            }
            if (releaseKeyPassword != null) {
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "io.github.regstar2.textquestanthology"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.4.0"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            buildConfigField "String", "YANDEX_AD_DISTRIBUTION", buildConfigString("rustore-dev")
            buildConfigField "String", "YANDEX_BANNER_AD_UNIT_ID", buildConfigString(yandexDemoBannerAdUnitId)
            buildConfigField "String", "YANDEX_INTERSTITIAL_AD_UNIT_ID", buildConfigString(yandexDemoInterstitialAdUnitId)
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "String", "YANDEX_AD_DISTRIBUTION", buildConfigString("rustore")
            buildConfigField "String", "YANDEX_BANNER_AD_UNIT_ID", buildConfigString(yandexProductionBannerAdUnitId)
            buildConfigField "String", "YANDEX_INTERSTITIAL_AD_UNIT_ID", buildConfigString(yandexProductionInterstitialAdUnitId)
        }
    }
}

tasks.register("validateReleaseSigningConfig") {
    group = "verification"
    description = "Fails when production release signing is incomplete or the configured keystore is missing."

    doLast {
        def missing = missingReleaseSigningValues()
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Release signing is not configured. Missing: " +
                missing.join(", ") +
                ". Configure android/keystore.properties or TEXT_QUEST_SIGNING_* environment variables. " +
                "See docs/testing/release-signing.md."
            )
        }

        if (!releaseStoreFile.isFile()) {
            throw new GradleException(
                "Release signing keystore does not exist: " + releaseStoreFile.absolutePath
            )
        }
    }
}

tasks.register("validateReleaseAdsConfig") {
    group = "verification"
    description = "Fails when release Yandex Ads configuration is missing or uses demo placement IDs."

    doLast {
        validateProductionAdUnitId("YANDEX_BANNER_AD_UNIT_ID", yandexProductionBannerAdUnitId)
        validateProductionAdUnitId("YANDEX_INTERSTITIAL_AD_UNIT_ID", yandexProductionInterstitialAdUnitId)
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn("validateReleaseSigningConfig")
        task.dependsOn("validateReleaseAdsConfig")
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.yandex.android:mobileads:8.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

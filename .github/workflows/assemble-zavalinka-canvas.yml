name: Assemble Zavalinka authoring references

on:
  push:
    branches:
      - "feature/v0.2.0-zavalinka-ink-skeleton"
    paths:
      - ".github/workflows/assemble-zavalinka-canvas.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact canvas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stories/zavalinka/design
          cat \
            stories/zavalinka/design/.canvas-upload/part00.b64 \
            stories/zavalinka/design/.canvas-upload/part01.b64 \
            stories/zavalinka/design/.canvas-upload/part02.b64 \
            stories/zavalinka/design/.canvas-upload/part03.b64 \
            | base64 -d \
            | gzip -d \
            > stories/zavalinka/design/zavalinka-decision-map.canvas
          echo "0f9f6c18a78ba22e5844bfbb41078a44816c1c2c29d5ef3517945836ab5bd098  stories/zavalinka/design/zavalinka-decision-map.canvas" | sha256sum -c -

      - name: Copy AI text signs reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/Regstar2/template/main/%D0%BF%D1%80%D0%B8%D0%B7%D0%BD%D0%B0%D0%BA%D0%B8%20%D0%B8%D0%B8/ai_text_signs_full_511.md" \
            -o stories/zavalinka/design/ai-text-signs-full-511.md
          test "$(wc -c < stories/zavalinka/design/ai-text-signs-full-511.md)" -eq 135799

      - name: Commit authoring references and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf stories/zavalinka/design/.canvas-upload
          rm -f .github/workflows/assemble-zavalinka-canvas.yml
          git add -A
          git commit -m "docs(zavalinka): add authoring references"
          git push origin HEAD:feature/v0.2.0-zavalinka-ink-skeleton

# One-shot preparation workflow for the current v0.2.0 authoring branch.
name: Assemble Zavalinka authoring references

on:
  push:
    branches:
      - "feature/v0.2.0-zavalinka-ink-skeleton"
    paths:
      - ".github/workflows/assemble-zavalinka-canvas.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild current canvas and copy AI text signs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $design = 'stories/zavalinka/design'
          New-Item -ItemType Directory -Path $design -Force | Out-Null

          @'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const path = require('node:path');

          const design = path.join('stories', 'zavalinka', 'design');
          const parts = [0, 1, 2, 3].map(index => {
            const name = `part${String(index).padStart(2, '0')}.b64`;
            return fs.readFileSync(path.join(design, '.canvas-upload', name), 'utf8').trim();
          });
          const compressed = Buffer.from(parts.join(''), 'base64');
          if (compressed.length !== 23289) {
            throw new Error(`Unexpected compressed canvas size: ${compressed.length}`);
          }
          const canvas = zlib.gunzipSync(compressed);
          fs.writeFileSync(path.join(design, 'zavalinka-decision-map.canvas'), canvas);
          '@ | Set-Content -Path "$env:RUNNER_TEMP/rebuild-zavalinka-canvas.cjs" -Encoding utf8

          node "$env:RUNNER_TEMP/rebuild-zavalinka-canvas.cjs"

          $canvasPath = "$design/zavalinka-decision-map.canvas"
          $actualHash = (Get-FileHash $canvasPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '94ecf888e57d714374b920b310808b814994e453735602eabecb8604403b0131'
          if ($actualHash -ne $expectedHash) {
            throw "Canvas SHA-256 mismatch: $actualHash"
          }

          $aiUrl = 'https://raw.githubusercontent.com/Regstar2/template/main/%D0%BF%D1%80%D0%B8%D0%B7%D0%BD%D0%B0%D0%BA%D0%B8%20%D0%B8%D0%B8/ai_text_signs_full_511.md'
          $aiPath = "$design/ai-text-signs-full-511.md"
          Invoke-WebRequest -Uri $aiUrl -OutFile $aiPath -UseBasicParsing
          if ((Get-Item $aiPath).Length -ne 135799) {
            throw "Unexpected AI text signs file size: $((Get-Item $aiPath).Length)"
          }

      - name: Commit authoring references and remove upload staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item 'stories/zavalinka/design/.canvas-upload' -Recurse -Force
          Remove-Item '.github/workflows/assemble-zavalinka-canvas.yml' -Force
          git add -A
          git commit -m 'docs(zavalinka): add current authoring references'
          git push origin HEAD:feature/v0.2.0-zavalinka-ink-skeleton

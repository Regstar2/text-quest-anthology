# One-shot preparation workflow for the current v0.2.0 authoring branch.
name: Assemble Zavalinka authoring references

on:
  push:
    branches:
      - "feature/v0.2.0-zavalinka-ink-skeleton"
    paths:
      - ".github/workflows/assemble-zavalinka-canvas.yml"
      - "stories/zavalinka/design/.canvas-upload/**"
      - "stories/zavalinka/design/.ai-upload/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild current authoring references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $design = 'stories/zavalinka/design'
          New-Item -ItemType Directory -Path $design -Force | Out-Null

          @'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const path = require('node:path');

          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const design = path.join('stories', 'zavalinka', 'design');

          const canvasPartHashes = [
            '291adf7371d44867faaae092aef503d6fd161861eb2eedd13a10e04d546934f1',
            'f2a7957ddf64b0e769669e1dd420177cf69967f79277f603cfb5305db544b688',
            '9d617e283a0fc7d6e6ffa25feea2fd9a25c661610dfb295795b0d00537859e63',
            '6820c999874e38fdcc25b4402668bc2a52c595a5c44a63f974c9b471241a1888',
          ];
          const canvasParts = canvasPartHashes.map((expectedHash, index) => {
            const name = `part${String(index).padStart(2, '0')}.b64`;
            const value = fs.readFileSync(path.join(design, '.canvas-upload', name), 'utf8').trim();
            const hash = sha256(Buffer.from(value, 'utf8'));
            if (hash !== expectedHash) {
              throw new Error(`Canvas ${name} SHA-256 mismatch: ${hash}`);
            }
            return value;
          });
          const canvasCompressed = Buffer.from(canvasParts.join(''), 'base64');
          const canvasCompressedHash = sha256(canvasCompressed);
          if (canvasCompressed.length !== 23289 || canvasCompressedHash !== '4414809c28e3b87bf825fe021afe3985724ccfd2c6a39b27768b057a9ebcb63d') {
            throw new Error(`Compressed canvas mismatch: bytes=${canvasCompressed.length} sha256=${canvasCompressedHash}`);
          }
          const canvas = zlib.gunzipSync(canvasCompressed);
          const canvasHash = sha256(canvas);
          if (canvas.length !== 99334 || canvasHash !== '94ecf888e57d714374b920b310808b814994e453735602eabecb8604403b0131') {
            throw new Error(`Canvas mismatch: bytes=${canvas.length} sha256=${canvasHash}`);
          }
          fs.writeFileSync(path.join(design, 'zavalinka-decision-map.canvas'), canvas);

          const aiPartHashes = [
            '5c72dfaaaf2b9b2cd7ffd2860c0f1cdc8ad89fe8102ab9e623fa07e768a2fffb',
            '2760fb9cd51732e01671da4a71079fafafde76385c18ddff012cd395b5dc754d',
            '352a8f32ad4a68c9e4456c745f8787adb320bbabd65921a7d481537f9628c3b1',
          ];
          const aiParts = aiPartHashes.map((expectedHash, index) => {
            const name = `part${String(index).padStart(2, '0')}.b64`;
            const value = fs.readFileSync(path.join(design, '.ai-upload', name), 'utf8').trim();
            const hash = sha256(Buffer.from(value, 'utf8'));
            if (hash !== expectedHash) {
              throw new Error(`AI reference ${name} SHA-256 mismatch: ${hash}`);
            }
            return value;
          });
          const aiBase64 = aiParts.join('');
          if (aiBase64.length !== 42040) {
            throw new Error(`AI reference base64 length mismatch: ${aiBase64.length}`);
          }
          const aiCompressed = Buffer.from(aiBase64, 'base64');
          const aiCompressedHash = sha256(aiCompressed);
          if (aiCompressed.length !== 31528 || aiCompressedHash !== '8a2dea22aaf2845665377470f624c781610c7d6e36f216cf9312ddbcac8e6fe0') {
            throw new Error(`Compressed AI reference mismatch: bytes=${aiCompressed.length} sha256=${aiCompressedHash}`);
          }
          const ai = zlib.gunzipSync(aiCompressed);
          const aiHash = sha256(ai);
          if (ai.length !== 135799 || aiHash !== '8a6e2c4da0ef49f3e091c20f3f89804fdbe1500672ab7823b099fe2d5ec0c0f0') {
            throw new Error(`AI reference mismatch: bytes=${ai.length} sha256=${aiHash}`);
          }
          fs.writeFileSync(path.join(design, 'ai-text-signs-full-511.md'), ai);

          console.log(`canvas: bytes=${canvas.length} sha256=${canvasHash}`);
          console.log(`ai-reference: bytes=${ai.length} sha256=${aiHash}`);
          '@ | Set-Content -Path "$env:RUNNER_TEMP/rebuild-zavalinka-references.cjs" -Encoding utf8

          node "$env:RUNNER_TEMP/rebuild-zavalinka-references.cjs"

      - name: Commit authoring references and remove upload staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item 'stories/zavalinka/design/.canvas-upload' -Recurse -Force
          Remove-Item 'stories/zavalinka/design/.ai-upload' -Recurse -Force
          Remove-Item '.github/workflows/assemble-zavalinka-canvas.yml' -Force
          git add -A
          git commit -m 'docs(zavalinka): add current authoring references'
          git push origin HEAD:feature/v0.2.0-zavalinka-ink-skeleton

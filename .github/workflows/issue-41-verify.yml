name: Issue 41 verification

on:
  push:
    branches:
      - feat/issue-41-v0.2.8-integration
  pull_request:
    branches:
      - v0.2.7

permissions:
  contents: write

concurrency:
  group: issue-41-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Commit generated story package
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- src/stories/generated; then
            echo "Generated story package is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stories/generated
          git commit -m "build: sync generated Zavalinka package (#41)"
          git push origin HEAD:feat/issue-41-v0.2.8-integration

name: Release candidate verification

on:
  push:
    branches:
      - release/issue-57-v0.4.0-rc
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue-57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

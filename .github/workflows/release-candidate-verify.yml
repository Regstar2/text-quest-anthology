name: Release candidate verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue-57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3             "platform-tools"             "platforms;android-37.0"             "build-tools;37.0.0"             "ndk;27.1.12297006"

          # Android 17 is currently published by sdkmanager as android-37.0,
          # while the current Gradle configuration resolves compileSdk 37 as android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify release Android configuration
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:validateReleaseAdsConfig :app:processReleaseMainManifest :app:compileReleaseKotlin -x :app:validateReleaseSigningConfig
          cd ..
          npm run verify:release-privacy

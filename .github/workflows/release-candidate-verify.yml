name: Release candidate verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue-57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify release Android configuration
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:validateReleaseAdsConfig :app:processReleaseMainManifest :app:compileReleaseKotlin -x :app:validateReleaseSigningConfig
          cd ..
          npm run verify:release-privacy

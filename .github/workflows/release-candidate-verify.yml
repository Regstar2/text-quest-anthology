name: Release candidate verification

on:
  push:
    branches:
      - release/issue-57-v0.4.0-rc
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: issue-57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify release Android configuration
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:validateReleaseAdsConfig :app:processReleaseMainManifest :app:compileReleaseKotlin -x :app:validateReleaseSigningConfig
          cd ..
          npm run verify:release-privacy

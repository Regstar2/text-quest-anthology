name: Bootstrap verification

on:
  push:
    branches:
      - feature/v0.1.0-android-bootstrap

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Download official React Native Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/react-native-community/template/0.87-stable/template/android"
          curl -fsSL "$base/gradlew" -o android/gradlew
          curl -fsSL "$base/gradlew.bat" -o android/gradlew.bat
          curl -fsSL "$base/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = "d997cfc60f4cff0e7451d19d49a82fa986695d07"

      - name: TypeScript, lint and unit tests
        run: npm run verify

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Commit generated lockfile and Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar
          git update-index --chmod=+x android/gradlew
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock Android bootstrap toolchain"
          git push origin HEAD:feature/v0.1.0-android-bootstrap
